services:
  - type: web
    name: retrix
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 gunicorn --workers 1 --threads 8 --worker-class gthread --timeout 120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FLASK_ENV
        value: production
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: retrix-db
          property: connectionString

databases:
  - name: retrix-db
    databaseName: retrix
    plan: free
