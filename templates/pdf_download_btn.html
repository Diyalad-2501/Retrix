<!-- PDF Download Button -->
<button class="pdf-download-btn" id="pdfBtn" title="Download as PDF">
    <i class="fas fa-download"></i>
    Download PDF
</button>

<!-- Button Styles -->
<style>
.pdf-download-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #1a1a2e;
    border: none;
    padding: 15px 25px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(79, 172, 254, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
}

.pdf-download-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 25px rgba(79, 172, 254, 0.5);
}

.pdf-download-btn i {
    font-size: 18px;
}

/* Print Styles - Dark Background */
@media print {
    .pdf-download-btn {
        display: none !important;
    }
    
    /* Force dark background */
    body, html, body * {
        background: #1a1a2e !important;
        background-color: #1a1a2e !important;
        color: #e5e7eb !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    
    /* Main containers */
    .main-content, .content-wrapper, main, .container-fluid, .container {
        background: #1a1a2e !important;
    }
    
    /* Charts - prevent collision */
    .row {
        display: block !important;
    }
    
    .row > div {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 30px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }
    
    /* Chart containers */
    canvas {
        display: block !important;
        width: 100% !important;
        max-width: 800px !important;
        height: auto !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }
    
    /* Tables */
    .table-responsive {
        overflow: visible !important;
    }
    
    table {
        width: 100% !important;
    }
    
    /* Cards */
    .card, .dashboard-card, .analysis-card {
        background: rgba(79, 172, 254, 0.1) !important;
        border: 1px solid rgba(79, 172, 254, 0.2) !important;
        margin-bottom: 20px !important;
        page-break-inside: avoid !important;
    }
    
    /* Hide sidebar/navbar */
    .sidebar, .navbar {
        display: none !important;
    }
    
    /* Colors */
    h1, h2, h3, h4, h5, h6, th, td {
        color: #e5e7eb !important;
    }
    
    .text-muted {
        color: #9ca3af !important;
    }
    
    /* Page setup */
    @page {
        size: landscape;
        margin: 15mm;
    }
}
</style>

<!-- Print Script -->
<script>
document.getElementById('pdfBtn').addEventListener('click', function() {
    // Wait for charts to render before printing
    setTimeout(function() {
        window.print();
    }, 3000); // Wait 3 seconds for charts to render
});
</script>
