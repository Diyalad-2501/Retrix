[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrix"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "Werkzeug==3.0.1",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "openpyxl==3.1.2",
    "gunicorn==21.2.0",
    "psycopg[binary]==3.2.13",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "Pillow==12.1.1",
]
